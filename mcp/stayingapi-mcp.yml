description: >-
  StayingAPI operates a first-party hosted MCP server over Streamable HTTP, authenticated
  with OAuth 2.1 + PKCE (S256) and dynamic client registration, drawing on the same account
  and the same single credit balance as the REST keys but rate-limited on a separate
  per-user bucket. Seven read-only tools map close to 1:1 onto the REST operations.
server:
