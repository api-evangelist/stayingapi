description: >-
  StayingAPI ships one first-party client library: a typed TypeScript/JavaScript SDK on npm
  that handles Bearer auth, retries, cursor auto-pagination and — the important one —
  automatic polling of the 202 async job contract, so callers always see the synchronous
  { data, meta } shape. No first-party Python, Go, Ruby, Java, PHP or Rust package is
  published; the GitHub resource repos carry six-language examples against raw HTTP instead.
