name: StayingAPI
description: >-
  Unified accommodation-data API returning live search, availability, price, cross-OTA price comparison, and normalized
  reviews across Airbnb, Booking.com, Vrbo, and Google Hotels via a single normalized JSON schema, so one integration
  covers four platforms. Delivered over a nine-operation REST API, a hosted MCP server with seven read-only tools, and
  a typed TypeScript SDK, all drawing on one shared credit balance. Live calls are asynchronous — a scrape returns
  HTTP 202 with a jobId to poll — while a deterministic stay_test_ sandbox answers synchronously at zero credits.
  Failed, empty and blocked calls are never billed. Launched July 2026 with a published stability policy, a locked
  35-code error catalog, an llms.txt, an RFC 9727 api-catalog and fourteen installable agent skills.
