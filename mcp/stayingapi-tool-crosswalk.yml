description: >-
  StayingAPI is one of the cleaner MCP/REST alignments in the catalog: the seven read-only
  MCP tools map one-to-one onto seven of the nine REST operations, and the provider says so
  explicitly. There are no MCP-only tools. Two REST operations have no tool — the POST body
  form of search (redundant with the GET tool) and GET /account (billing introspection the
  server keeps out of the agent's hands). Each tool's real input contract is the backing
  operation's parameters in the OpenAPI; live tools/list is OAuth-gated so per-tool
  inputSchema could not be read directly, and confidence reflects that.
