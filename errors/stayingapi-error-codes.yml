- url: https://api.stayingapi.com/openapi.json
  http_status: 200
  note: components.schemas.Error enums
- url: https://stayingapi.com/docs/errors
  http_status: 200
- url: https://stayingapi.com/docs/errors/invalid_cursor
  http_status: 200
  note: one of 35 per-code pages fetched
notes:
- >-
  The subscription_required page references POST /v1/billing/topups, an operation not present in the public
  OpenAPI — the billing surface is dashboard-side and undocumented in the machine-readable contract.
- >-
  No RFC 9457 problem+json media type is offered on any response, so no problem-types artifact is derived.
