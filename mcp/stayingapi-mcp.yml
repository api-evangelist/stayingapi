  transport: streamable-http
  url: https://mcp.stayingapi.com/mcp
  schema_version: '2025-06-18'
  authentication:
    type: oauth2
    flows:
      - authorization_code
    pkce: S256
    dynamic_client_registration: true
    scopes:
